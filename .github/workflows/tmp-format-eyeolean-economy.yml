name: Temporary Eyeolean Economy Formatter

on:
  push:
    branches:
      - feature/eyeolean-economy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyeolean-economy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Eyeolean economy changes
        run: >-
          npx prettier --write
          docs/EYEOLEAN_ECONOMY.md
          src/economy/eyeoleans.ts
          src/economy/eyeoleans.test.ts
          src/screens/GameOver/GameOver.css
          src/screens/GameOver/GameOver.tsx
          src/screens/Profile/Profile.tsx
          src/store/eliminatedSeasonResolutionMiddleware.ts
          src/store/profilesSlice.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/store/profilesSlice.forecastReward.test.ts
          src/store/settingsSlice.ts
          src/types/index.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EYEOLEAN_ECONOMY.md
          git add src/economy/eyeoleans.ts
          git add src/economy/eyeoleans.test.ts
          git add src/screens/GameOver/GameOver.css
          git add src/screens/GameOver/GameOver.tsx
          git add src/screens/Profile/Profile.tsx
          git add src/store/eliminatedSeasonResolutionMiddleware.ts
          git add src/store/profilesSlice.ts
          git add src/store/profilesSlice.eyeoleans.test.ts
          git add src/store/profilesSlice.forecastReward.test.ts
          git add src/store/settingsSlice.ts
          git add src/types/index.ts
          git commit -m "Format Eyeolean economy implementation"
          git push origin HEAD:feature/eyeolean-economy
