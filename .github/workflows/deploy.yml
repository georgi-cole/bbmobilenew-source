name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/generate-after-the-eye-config.mjs'
      - 'scripts/generate-audio-manifest.mjs'
      - 'scripts/check-production-debug-globals.mjs'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages-deploy
  # Never interrupt a database migration when a newer deployment is queued.
  cancel-in-progress: false

jobs:
  release-quality:
    name: Required release-quality checks
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-public-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:guard
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run build:mobile
      - run: npm audit --omit=dev --audit-level=high

  build-and-deploy:
    name: Build and publish public site
    # Manual runs on other branches and fork workflows cannot reach production credentials.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-public-deploy]'))
    needs: [release-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          VITE_APP_ENVIRONMENT: production
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_VIP_DEV_ENTITLEMENT: 'false'
          VITE_BASE_PATH: '/bbmobilenew/'
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
        run: |
          test "$VITE_SUPABASE_ENABLED" = "true"
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "VITE_SUPABASE_URL must be a Supabase HTTPS project URL" >&2; exit 1;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "VITE_SUPABASE_PUBLISHABLE_KEY must be a publishable key" >&2; exit 1;; esac
          npm run build

      - name: Preserve production build
        run: mv dist dist-production

      - name: Build QA site with developer access
        env:
          VITE_APP_ENVIRONMENT: qa
          VITE_BUILD_ID: ${{ github.sha }}-qa
          VITE_BUILD_TARGET: admin
          VITE_VIP_DEV_ENTITLEMENT: 'true'
          VITE_BASE_PATH: '/bbmobilenew/qa/'
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
        run: |
          test "$VITE_SUPABASE_ENABLED" = "true"
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "VITE_SUPABASE_URL must be a Supabase HTTPS project URL" >&2; exit 1;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "VITE_SUPABASE_PUBLISHABLE_KEY must be a publishable key" >&2; exit 1;; esac
          npm run build

      - name: Combine production and QA sites
        run: |
          mv dist dist-qa
          mkdir -p dist/qa
          cp -R dist-production/. dist/
          cp -R dist-qa/. dist/qa/

      - name: Validate automatic Supabase migration settings
        shell: bash
        env:
          SUPABASE_MIGRATIONS_ENABLED: ${{ vars.SUPABASE_MIGRATIONS_ENABLED }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          case "$SUPABASE_MIGRATIONS_ENABLED" in
            ''|false) echo "Automatic Supabase migrations are disabled."; exit 0 ;;
            true) ;;
            *) echo "::error::SUPABASE_MIGRATIONS_ENABLED must be true, false, or unset."; exit 1 ;;
          esac
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required when automatic Supabase migrations are enabled."
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]+$ ]] || [ "$VITE_SUPABASE_URL" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]; then
            echo "::error::SUPABASE_PROJECT_REF must match the production VITE_SUPABASE_URL project."
            exit 1
          fi

      - name: Set up pinned Supabase CLI
        if: vars.SUPABASE_MIGRATIONS_ENABLED == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Apply pending Supabase migrations before publish
        if: vars.SUPABASE_MIGRATIONS_ENABLED == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Both sites share this project. Apply only this commit's reviewed migrations once.
          git diff --exit-code HEAD -- supabase/migrations supabase/config.toml
          untracked_migrations="$(git ls-files --others -- supabase/migrations supabase/config.toml)"
          if [ -n "$untracked_migrations" ]; then
            echo "::error::Untracked Supabase migration files or configuration cannot be deployed."
            exit 1
          fi
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --yes

      - name: Check out the public deployment repository
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          git clone --depth=1 "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${{ github.repository_owner }}/bbmobilenew.git" deployment

      - name: Replace the public files with this build
        run: rsync -a --delete --exclude .git dist/ deployment/

      - name: Publish the public build
        working-directory: deployment
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No public-file changes to publish."
            exit 0
          fi
          git commit -m "Deploy source build ${{ github.sha }}"
          git push origin main
