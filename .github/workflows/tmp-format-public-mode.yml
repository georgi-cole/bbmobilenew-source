name: Temporary Public Mode Formatter

on:
  push:
    branches:
      - feature/public-mode-audience-simulation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-mode-audience-simulation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Public Mode changes
        run: >-
          npx prettier --write
          PUBLIC_MODE.md
          src/publicOpinion/AudienceStoryService.ts
          src/publicOpinion/EventDrivenReactionService.ts
          src/publicOpinion/PublicSaveService.ts
          src/publicOpinion/__tests__/AudienceStoryService.test.ts
          src/publicOpinion/audienceBreakdown.ts
          src/publicOpinion/publicOpinionMiddleware.ts
          src/screens/GameScreen/flows/useTwistFlow.ts
          src/screens/PublicMeter/PublicMeter.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLIC_MODE.md
          git add src/publicOpinion/AudienceStoryService.ts
          git add src/publicOpinion/EventDrivenReactionService.ts
          git add src/publicOpinion/PublicSaveService.ts
          git add src/publicOpinion/__tests__/AudienceStoryService.test.ts
          git add src/publicOpinion/audienceBreakdown.ts
          git add src/publicOpinion/publicOpinionMiddleware.ts
          git add src/screens/GameScreen/flows/useTwistFlow.ts
          git add src/screens/PublicMeter/PublicMeter.tsx
          git commit -m "Format Public Mode audience simulation"
          git push --no-verify origin HEAD:feature/public-mode-audience-simulation
