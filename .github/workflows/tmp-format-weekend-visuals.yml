name: Temporary Weekend Visual Formatter

on:
  push:
    branches:
      - codex/weekend-foundation-hub-says

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/weekend-foundation-hub-says
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format weekend visual CSS
        run: npx prettier --write src/components/WeekendInterludeOverlay/WeekendInterludeOverlay.css
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-format-weekend-visuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WeekendInterludeOverlay/WeekendInterludeOverlay.css
          git commit -m "Format weekend visual styling"
          git push --no-verify origin HEAD:codex/weekend-foundation-hub-says
