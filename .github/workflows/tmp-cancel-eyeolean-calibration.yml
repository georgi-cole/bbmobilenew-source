name: Temp Cancel Eyeolean Calibration

on:
  push:

permissions:
  actions: write
  contents: read

jobs:
  stop-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel calibration runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST /repos/georgi-cole/bbmobilenew/actions/runs/35986783950/cancel
          gh api --method POST /repos/georgi-cole/bbmobilenew/actions/runs/35986429359/cancel
