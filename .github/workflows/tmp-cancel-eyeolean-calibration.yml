name: Temp Cancel Eyeolean Calibration

on:
  push:
    branches:
      - feature/eyeolean-economy

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.event.head_commit.message == 'chore: cancel Eyeolean calibration'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel calibration run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/35986783950/cancel
