name: Temporary Eyeolean Verification

on:
  push:
    branches:
      - feature/eyeolean-economy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyeolean-economy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check changed formatting
        env:
          FORMAT_BASE_REF: origin/main
        run: npm run format:check
      - name: Run Eyeolean integration tests
        run: >-
          npx vitest run
          src/economy/eyeoleans.test.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/store/profilesSlice.forecastReward.test.ts
          tests/unit/profilesSlice.test.ts
          tests/unit/publicFavoriteOverlay.test.tsx
          src/components/PublicFavoriteOverlay/__tests__/PublicFavoriteOverlay.identityReveal.test.tsx
          tests/gameOver.screen.test.tsx
          tests/favoritePlayer.flow.test.ts
