name: iOS Store Cloud Build

on:
  push:
    branches: ['codex/store-release-cloud-*']
  workflow_dispatch:
    inputs:
      sign_archive:
        description: Export a signed iOS app without uploading it to Apple
        required: true
        type: boolean
        default: false
      upload_to_testflight:
        description: Sign and upload to TestFlight using the configured Apple credentials
        required: true
        type: boolean
        default: false
      testflight_build:
        description: Check an existing TestFlight build without uploading (version+build number)
        type: string
        default: ''
      reuse_exemption_from:
        description: Existing TestFlight build with a recorded exemption and the same encryption (version+build number)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-store-cloud-${{ github.ref }}-${{ inputs.sign_archive || inputs.upload_to_testflight || false }}
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ !inputs.testflight_build }}
    name: Compile the iOS store archive
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VITE_BUILD_TARGET: release
      VITE_VIP_DEV_ENTITLEMENT: 'false'
      VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_WEATHER_API_URL: https://the-big-eye-weather-proxy.kolequant.workers.dev/v1/current-weather
      VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
      VITE_BIG_EYE_AI_ENABLED: ${{ vars.VITE_BIG_EYE_AI_ENABLED }}
      VITE_BIG_EYE_VIP_API_URL: ${{ vars.VITE_BIG_EYE_VIP_API_URL }}
      VITE_GAME_MINIMUM_AGE: '18'
      VITE_ADMOB_MODE: live
      VITE_ADMOB_APP_ID: ca-app-pub-9243398419153145~3393385791
      VITE_ADMOB_INTERSTITIAL_ID: ca-app-pub-9243398419153145/1852027238
      VITE_ADMOB_REWARDED_ID: ca-app-pub-9243398419153145/2733864063
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the verified store configuration
        run: |
          cp .env.ios.example .env.ios.local
          npm run prepare:store:ios
          npm run check:production-debug-globals
      - name: Install signing credentials
        if: inputs.sign_archive == true || inputs.upload_to_testflight == true
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD',
                      'IOS_PROVISIONING_PROFILE_BASE64', 'ASC_API_KEY_P8_BASE64',
                      'ASC_API_KEY_ID', 'ASC_API_ISSUER_ID']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub signing secrets: ' + ', '.join(missing))
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'distribution.p12').write_bytes(base64.b64decode(os.environ['IOS_DISTRIBUTION_P12_BASE64']))
          (temp / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['IOS_PROVISIONING_PROFILE_BASE64']))
          keys = pathlib.Path.home() / '.appstoreconnect' / 'private_keys'
          keys.mkdir(parents=True, exist_ok=True)
          key = keys / ('AuthKey_' + os.environ['ASC_API_KEY_ID'] + '.p8')
          key.write_bytes(base64.b64decode(os.environ['ASC_API_KEY_P8_BASE64']))
          key.chmod(0o600)
          PY
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/the-big-eye-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          ios_profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$ios_profile_dir"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$ios_profile_dir/$uuid.mobileprovision"
          echo "IOS_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Archive without signing
        if: inputs.sign_archive != true && inputs.upload_to_testflight != true
        run: >-
          xcodebuild archive
          -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Archive with distribution signing
        if: inputs.sign_archive == true || inputs.upload_to_testflight == true
        run: >-
          xcodebuild archive
          -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          BIG_EYE_IOS_CODE_SIGN_STYLE=Manual
          BIG_EYE_IOS_CODE_SIGN_IDENTITY="Apple Distribution"
          BIG_EYE_IOS_PROVISIONING_PROFILE="$IOS_PROFILE_UUID"
      - name: Verify the archived iOS version and default icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib
          settings = dict(
              tuple(part.strip() for part in line.split('=', 1))
              for line in pathlib.Path('ios/App/Release.xcconfig').read_text().splitlines()
              if '=' in line and not line.startswith('//')
          )
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'TheBigEye.xcarchive'
          with (archive / 'Products/Applications/App.app/Info.plist').open('rb') as file:
              info = plistlib.load(file)
          icons = info.get('CFBundleIcons', {})
          actual = (
              info.get('CFBundleShortVersionString'),
              icons.get('CFBundlePrimaryIcon', {}).get('CFBundleIconName'),
          )
          expected = (settings['MARKETING_VERSION'], settings['ASSETCATALOG_COMPILER_APPICON_NAME'])
          if actual != expected or icons.get('CFBundleAlternateIcons'):
              raise SystemExit(f'Expected version and primary icon {expected} with no alternate icons. Found {actual}.')
          print(f'Archived iOS {actual[0]} with default icon {actual[1]}.')
          PY
      - name: Export the signed iOS app
        if: inputs.sign_archive == true || inputs.upload_to_testflight == true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib
          options = {
              'method': 'app-store-connect', 'signingStyle': 'manual',
              'teamID': 'C97T2A5255', 'signingCertificate': 'Apple Distribution',
              'manageAppVersionAndBuildNumber': False,
              'provisioningProfiles': {'com.georgicole.thebigeye': os.environ['IOS_PROFILE_UUID']},
          }
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist'
          target.write_bytes(plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ipa_files=("$RUNNER_TEMP/ipa/"*.ipa)
          test "${#ipa_files[@]}" -eq 1
          unpacked="$RUNNER_TEMP/verified-ipa"
          unzip -q "${ipa_files[0]}" -d "$unpacked"
          app_files=("$unpacked/Payload/"*.app)
          test "${#app_files[@]}" -eq 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_files[0]}/Info.plist")" = com.georgicole.thebigeye
          python3 -c 'import plistlib, sys; assert plistlib.load(open(sys.argv[1], "rb"))["UIDeviceFamily"] == [1]' "${app_files[0]}/Info.plist"
          codesign --verify --deep --strict --verbose=2 "${app_files[0]}"
          signature_info=$(codesign -d --verbose=4 "${app_files[0]}" 2>&1)
          [[ "$signature_info" == *"TeamIdentifier=C97T2A5255"* ]]
      - name: Upload to TestFlight
        if: inputs.upload_to_testflight == true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ipa_files=("$RUNNER_TEMP/ipa/"*.ipa)
          test "${#ipa_files[@]}" -eq 1
          xcrun altool --upload-app -f "${ipa_files[0]}" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" --output-format json
      - name: Package the compiled archive
        run: tar -czf "$RUNNER_TEMP/TheBigEye.xcarchive.tar.gz" -C "$RUNNER_TEMP" TheBigEye.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: the-big-eye-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/TheBigEye.xcarchive.tar.gz
            ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Check TestFlight processing and availability
        if: inputs.upload_to_testflight == true
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/TheBigEye.xcarchive/Products/Applications/App.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          TESTFLIGHT_BUILD="$version+$GITHUB_RUN_NUMBER" node scripts/testflight-status.mjs
      - name: Remove temporary signing credentials
        if: always() && (inputs.sign_archive == true || inputs.upload_to_testflight == true)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/the-big-eye-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "${ASC_API_KEY_ID:-}" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8"
          fi
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi

  testflight:
    if: inputs.testflight_build
    name: Check an uploaded TestFlight build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check TestFlight processing and availability
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TESTFLIGHT_BUILD: ${{ inputs.testflight_build }}
          TESTFLIGHT_REUSE_EXEMPTION_FROM: ${{ inputs.reuse_exemption_from }}
          TESTFLIGHT_WAIT_MINUTES: '5'
        run: node scripts/testflight-status.mjs
