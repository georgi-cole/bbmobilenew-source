name: Pull Request Quality

on:
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.impact.outputs.runtime }}
      dependencies: ${{ steps.impact.outputs.dependencies }}
      android: ${{ steps.impact.outputs.android }}
      ios: ${{ steps.impact.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: impact
        name: Classify changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          runtime=false
          dependencies=false
          android=false
          ios=false

          if grep -Eq '^(src/|public/|scripts/|index\.html$|package(-lock)?\.json$|vite\.config\.[^/]+$|tsconfig[^/]*\.json$|capacitor\.config\.[^/]+$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            runtime=true
          fi

          if grep -Eq '^package(-lock)?\.json$' <<< "$changed_files"; then
            dependencies=true
          fi

          if grep -Eq '^(android/|package(-lock)?\.json$|capacitor\.config\.[^/]+$|scripts/)' <<< "$changed_files"; then
            android=true
          fi

          if grep -Eq '^(ios/|package(-lock)?\.json$|capacitor\.config\.[^/]+$|scripts/)' <<< "$changed_files"; then
            ios=true
          fi

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  static-quality:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Formatting
            command: npm run format:check
            fetch_depth: 0
          - label: Test hygiene
            command: npm run test:guard
            fetch_depth: 1
          - label: ESLint
            command: npm run lint:ci
            fetch_depth: 1
          - label: TypeScript
            command: npm run typecheck
            fetch_depth: 1
          - label: Core regressions
            command: npm run test:pr-core
            fetch_depth: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.label }}
        run: ${{ matrix.command }}

  dependency-security:
    name: Dependency security
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-builds:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  android-native:
    name: Android native lint and debug build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync:android
      - name: Lint and compile the Android app
        working-directory: android
        run: ./gradlew lintDebug assembleDebug

  ios-native:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Compile the iOS app without signing
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -sdk iphonesimulator
          ARCHS=arm64
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
