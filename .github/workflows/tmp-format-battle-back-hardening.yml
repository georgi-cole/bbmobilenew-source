name: Temporary Battle Back Formatter

on:
  push:
    branches:
      - fix/battle-back-system-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-back-system-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Battle Back hardening changes
        run: >-
          npx prettier --write
          server/live-config.example.json
          src/features/twists/seasonDirector.ts
          src/screens/GameScreen/flows/useTwistFlow.ts
          src/store/gameSlice.ts
          src/types/index.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/live-config.example.json
          git add src/features/twists/seasonDirector.ts
          git add src/screens/GameScreen/flows/useTwistFlow.ts
          git add src/store/gameSlice.ts
          git add src/types/index.ts
          git commit -m "Format Battle Back hardening"
          git push origin HEAD:fix/battle-back-system-hardening
