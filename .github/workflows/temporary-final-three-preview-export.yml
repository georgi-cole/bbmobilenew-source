name: Temporary Final Three Preview Export
on:
  push:
    branches:
      - codex/f3-preview-export-20261102
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Bundle the actual spectator component
        run: node scripts/build-f3-preview.mjs
      - name: Record four real spectator broadcasts
        run: |
          command -v ffmpeg
          node scripts/record-f3-preview.mjs
      - name: Upload playable MP4 recordings and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Big-Eye-Final-Three-Review-Videos
          path: |
            preview-export/recordings/*.mp4
            preview-export/recordings/*.png
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
