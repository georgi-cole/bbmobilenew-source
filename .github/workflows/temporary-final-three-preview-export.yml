name: Temporary Final Three Preview Export
on:
  push:
    branches:
      - codex/f3-preview-export-20261102
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build self-contained review component
        run: |
          npm ci
          node scripts/build-f3-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: f3-preview-component-20261102
          path: preview-export/preview/
          retention-days: 1
          compression-level: 6
