name: Build TestFlight and signed Android apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    name: Validate the selected store source
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/testflight-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:pr
      - run: node --test scripts/mobile-store-workflow.test.mjs

  upload:
    name: Build, sign, and upload iOS app
    needs: quality
    # Automatic main builds and explicitly selected TestFlight candidates share validation.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/testflight-')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out selected TestFlight source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check Apple signing and upload credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_API_ISSUER_ID ASC_API_KEY_ID ASC_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See docs/AUTOMATIC_MOBILE_BUILDS.md."
              exit 1
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure production iOS app
        env:
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
          VITE_PLAYER_SIGN_IN_ENABLED: ${{ vars.VITE_PLAYER_SIGN_IN_ENABLED }}
          VITE_BUILD_ID: ${{ github.sha }}
        run: |
          test "$VITE_SUPABASE_ENABLED" = "true"
          test "$VITE_PLAYER_ACCOUNTS_ENABLED" = "true"
          test "$VITE_PLAYER_SIGN_IN_ENABLED" = "true"
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "VITE_SUPABASE_URL must be a Supabase HTTPS project URL." >&2; exit 1;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "VITE_SUPABASE_PUBLISHABLE_KEY must be a publishable key." >&2; exit 1;; esac
          cp .env.ios.example .env.ios
          sed -i '' 's/^VITE_ADMOB_MODE=test$/VITE_ADMOB_MODE=off/' .env.ios
          cat >> .env.ios <<EOF

          VITE_APP_ENVIRONMENT=production
          VITE_BUILD_TARGET=release
          VITE_BUILD_ID=$VITE_BUILD_ID
          VITE_VIP_DEV_ENTITLEMENT=false
          VITE_SUPABASE_ENABLED=$VITE_SUPABASE_ENABLED
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_PLAYER_ACCOUNTS_ENABLED=$VITE_PLAYER_ACCOUNTS_ENABLED
          VITE_PLAYER_SIGN_IN_ENABLED=$VITE_PLAYER_SIGN_IN_ENABLED
          EOF

      - name: Validate store build configuration
        run: npm run verify:store-env:ios

      - name: Build the production iOS web bundle
        env:
          VITE_APP_ENVIRONMENT: production
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_VIP_DEV_ENTITLEMENT: 'false'
          VITE_BUILD_TARGET: release
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
          VITE_PLAYER_SIGN_IN_ENABLED: ${{ vars.VITE_PLAYER_SIGN_IN_ENABLED }}
        run: npm run sync:ios

      - name: Install Apple signing certificate and profile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/testflight-signing.keychain-db"
          KEYCHAIN_PASSWORD="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-signing"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-distribution.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-distribution-profile.plist"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -f pkcs12 -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Archive and export the signed app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.georgicole.thebigeye</key>
              <string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IOS_IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload the build to App Store Connect
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_API_ISSUER_ID"
          test -n "$ASC_API_KEY_ID"
          test -n "$ASC_API_KEY_P8_BASE64"
          PRIVATE_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$PRIVATE_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IOS_IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Record uploaded build details
        run: |
          MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/TheBigEye.xcarchive/Products/Applications/App.app/Info.plist")
          {
            echo "## TestFlight upload"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Marketing version: $MARKETING_VERSION"
            echo "- Build number: $IOS_BUILD_NUMBER"
            echo "- Uploaded to App Store Connect for TestFlight processing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing materials
        if: always()
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID:-unused}.p8"

  android:
    name: Build the signed Google Play bundle
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check out the selected Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore the upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See docs/AUTOMATIC_MOBILE_BUILDS.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          # Jobs are serialized; a fresh UTC timestamp also advances on a rerun.
          echo "ANDROID_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci

      - name: Configure production Android services
        env:
          ANDROID_ADMOB_MODE: ${{ vars.ANDROID_ADMOB_MODE || 'off' }}
          ANDROID_ADMOB_APP_ID: ${{ vars.ANDROID_ADMOB_APP_ID }}
          ANDROID_ADMOB_INTERSTITIAL_ID: ${{ vars.ANDROID_ADMOB_INTERSTITIAL_ID }}
          ANDROID_ADMOB_REWARDED_ID: ${{ vars.ANDROID_ADMOB_REWARDED_ID }}
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
          VITE_PLAYER_SIGN_IN_ENABLED: ${{ vars.VITE_PLAYER_SIGN_IN_ENABLED }}
        run: |
          cp .env.android.example .env.android
          cat >> .env.android <<EOF

          VITE_APP_ENVIRONMENT=production
          VITE_BUILD_TARGET=release
          VITE_BUILD_ID=$GITHUB_SHA
          VITE_VIP_DEV_ENTITLEMENT=false
          VITE_ADMOB_MODE=$ANDROID_ADMOB_MODE
          VITE_ADMOB_APP_ID=$ANDROID_ADMOB_APP_ID
          VITE_ADMOB_INTERSTITIAL_ID=$ANDROID_ADMOB_INTERSTITIAL_ID
          VITE_ADMOB_REWARDED_ID=$ANDROID_ADMOB_REWARDED_ID
          VITE_SUPABASE_ENABLED=$VITE_SUPABASE_ENABLED
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_PLAYER_ACCOUNTS_ENABLED=$VITE_PLAYER_ACCOUNTS_ENABLED
          VITE_PLAYER_SIGN_IN_ENABLED=$VITE_PLAYER_SIGN_IN_ENABLED
          EOF
          npm run verify:store-env:android

      - name: Build and synchronize the production Android bundle
        run: npm run sync:android

      - name: Sign the release bundle with the existing upload key
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify the signed bundle
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab \
            > "$RUNNER_TEMP/android-signature-verification.txt"
          cat "$RUNNER_TEMP/android-signature-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/android-signature-verification.txt"

      - name: Save the Google Play upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Record signed Android build details
        run: |
          {
            echo "## Signed Google Play bundle"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Android version code: $ANDROID_VERSION_CODE"
            echo "- Download the signed AAB from this run's artifacts and upload it in Play Console."
            echo "- No signing-password entry is required when uploading this AAB."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary upload signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-upload-key.jks"
