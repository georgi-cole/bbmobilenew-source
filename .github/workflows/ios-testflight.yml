name: Build TestFlight and Google Play test apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    name: Validate the selected store source
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/testflight-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:pr
      - run: node --test scripts/mobile-store-workflow.test.mjs
      - run: node --test scripts/cinematic-pack-publishing.test.mjs
      - run: node --test scripts/google-play-internal.test.mjs
      - run: node --test scripts/testflight-readiness.test.mjs
      - run: node --test scripts/android-upload-certificate.test.mjs
      - run: node scripts/complete-testflight.mjs --check-policy

  cinematic-media:
    name: Publish and verify the matching cinematic download
    needs: quality
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/testflight-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish immutable media and verify the public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-vip-cinematic-pack.mjs

  upload:
    name: Build, sign, and upload iOS app
    needs: [quality, cinematic-media]
    # Automatic main builds and explicitly selected TestFlight candidates share validation.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/testflight-')
    # Use the GitHub-hosted Xcode 27 image so archives use a supported iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IOS_BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out selected TestFlight source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Verify the iOS upload SDK
        run: |
          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          if [[ ! "$IOS_SDK_MAJOR" =~ ^[0-9]+$ ]] || (( IOS_SDK_MAJOR < 27 )); then
            echo "::error::Expected the iOS 27 SDK or later, got $IOS_SDK_VERSION."
            exit 1
          fi
          echo "Using iOS SDK $IOS_SDK_VERSION."

      - name: Check Apple signing and upload credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_API_ISSUER_ID ASC_API_KEY_ID ASC_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See docs/AUTOMATIC_MOBILE_BUILDS.md."
              exit 1
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure production iOS app
        env:
          IOS_ADMOB_MODE: ${{ vars.IOS_ADMOB_MODE || 'live' }}
          IOS_ADMOB_APP_ID: ${{ vars.IOS_ADMOB_APP_ID || 'ca-app-pub-9243398419153145~3393385791' }}
          IOS_ADMOB_INTERSTITIAL_ID: ${{ vars.IOS_ADMOB_INTERSTITIAL_ID || 'ca-app-pub-9243398419153145/1852027238' }}
          IOS_ADMOB_REWARDED_ID: ${{ vars.IOS_ADMOB_REWARDED_ID || 'ca-app-pub-9243398419153145/2733864063' }}
          IOS_ADMOB_CONTEXTUAL_INTERSTITIAL_ID: ${{ vars.IOS_ADMOB_CONTEXTUAL_INTERSTITIAL_ID }}
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
          VITE_PLAYER_SIGN_IN_ENABLED: ${{ vars.VITE_PLAYER_SIGN_IN_ENABLED }}
          VITE_BUILD_ID: ${{ github.sha }}
        run: |
          test "$VITE_SUPABASE_ENABLED" = "true"
          test "$VITE_PLAYER_ACCOUNTS_ENABLED" = "true"
          test "$VITE_PLAYER_SIGN_IN_ENABLED" = "true"
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "VITE_SUPABASE_URL must be a Supabase HTTPS project URL." >&2; exit 1;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "VITE_SUPABASE_PUBLISHABLE_KEY must be a publishable key." >&2; exit 1;; esac
          cp .env.ios.example .env.ios
          cat >> .env.ios <<EOF

          VITE_APP_ENVIRONMENT=production
          VITE_BUILD_TARGET=release
          VITE_BUILD_ID=$VITE_BUILD_ID
          VITE_ADMOB_MODE=$IOS_ADMOB_MODE
          VITE_ADMOB_APP_ID=$IOS_ADMOB_APP_ID
          VITE_ADMOB_INTERSTITIAL_ID=$IOS_ADMOB_INTERSTITIAL_ID
          VITE_ADMOB_REWARDED_ID=$IOS_ADMOB_REWARDED_ID
          VITE_ADMOB_CONTEXTUAL_INTERSTITIAL_ID=$IOS_ADMOB_CONTEXTUAL_INTERSTITIAL_ID
          VITE_VIP_DEV_ENTITLEMENT=false
          VITE_SUPABASE_ENABLED=$VITE_SUPABASE_ENABLED
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_PLAYER_ACCOUNTS_ENABLED=$VITE_PLAYER_ACCOUNTS_ENABLED
          VITE_PLAYER_SIGN_IN_ENABLED=$VITE_PLAYER_SIGN_IN_ENABLED
          EOF

      - name: Validate store build configuration
        run: npm run verify:store-env:ios

      - name: Build the production iOS web bundle
        env:
          VITE_APP_ENVIRONMENT: production
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_VIP_DEV_ENTITLEMENT: 'false'
          VITE_BUILD_TARGET: release
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
          VITE_PLAYER_SIGN_IN_ENABLED: ${{ vars.VITE_PLAYER_SIGN_IN_ENABLED }}
        run: npm run sync:ios

      - name: Smoke-test iOS 27 launch
        # A cold simulator and Release build can exceed 15 minutes on a hosted runner.
        timeout-minutes: 25
        run: |
          echo 'Discovering an available iOS 27 iPhone simulator.'
          SIMULATOR_ID="$(xcrun simctl list devices available -j | node --input-type=module -e '
            import fs from "node:fs";
            const { devices } = JSON.parse(fs.readFileSync(0, "utf8"));
            const phones = Object.entries(devices)
              .filter(([runtime]) => runtime.includes(".iOS-27-"))
              .reverse()
              .flatMap(([, entries]) => entries.filter(({ name }) => name.startsWith("iPhone")));
            const device = phones.find(({ name }) => name === "iPhone 15") ?? phones[0];
            if (!device) throw new Error("An iOS 27 iPhone simulator is required");
            console.log(device.udid);
          ')"
          trap 'xcrun simctl shutdown "$SIMULATOR_ID" >/dev/null 2>&1 || true' EXIT
          echo "Booting simulator $SIMULATOR_ID."
          xcrun simctl boot "$SIMULATOR_ID" || xcrun simctl bootstatus "$SIMULATOR_ID"
          echo 'Compiling the release app for the simulator.'
          LAUNCH_DERIVED_DATA="$RUNNER_TEMP/launch-smoke"
          xcodebuild -quiet build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$LAUNCH_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$LAUNCH_DERIVED_DATA/Build/Products/Release-iphonesimulator/App.app"
          echo 'Launching the release app and checking that it stays running.'
          LAUNCH="$(xcrun simctl launch "$SIMULATOR_ID" com.georgicole.thebigeye)"
          APP_PID="${LAUNCH##*: }"
          sleep 12
          if [[ ! "$APP_PID" =~ ^[1-9][0-9]*$ ]] || ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::The Big Eye exited during the iOS 27 launch smoke test."
            xcrun simctl spawn "$SIMULATOR_ID" log show --last 30s --predicate 'process == "App"' | tail -60
            exit 1
          fi
          echo 'The Big Eye stayed running on the iOS 27 simulator.'

      - name: Install Apple signing certificate and profile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/testflight-signing.keychain-db"
          KEYCHAIN_PASSWORD="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-signing"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-distribution.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-distribution-profile.plist"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -f pkcs12 -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Archive and export the signed app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.georgicole.thebigeye</key>
              <string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TheBigEye.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IOS_IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Verify the signed IPA targets iPhone only
        run: |
          python3 - "$IOS_IPA_PATH" <<'PY'
          import plistlib
          import re
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as ipa:
              manifests = [name for name in ipa.namelist() if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)]
              if len(manifests) != 1:
                  sys.exit("The signed IPA must contain one top-level app Info.plist.")
              families = plistlib.loads(ipa.read(manifests[0])).get("UIDeviceFamily")
          if families != [1]:
              sys.exit(f"Expected signed IPA to target iPhone only, received UIDeviceFamily={families!r}.")
          print("Verified signed IPA device family: [1] (iPhone only).")
          PY

      - name: Upload the build to App Store Connect
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_API_ISSUER_ID"
          test -n "$ASC_API_KEY_ID"
          test -n "$ASC_API_KEY_P8_BASE64"
          PRIVATE_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$PRIVATE_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IOS_IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Complete compliance and verify internal TestFlight availability
        timeout-minutes: 25
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/complete-testflight.mjs

      - name: Record uploaded build details
        run: |
          MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/TheBigEye.xcarchive/Products/Applications/App.app/Info.plist")
          {
            echo "## TestFlight upload"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Marketing version: $MARKETING_VERSION"
            echo "- Build number: $IOS_BUILD_NUMBER"
            echo "- Processed and verified available to The Big Eye Internal testers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing materials
        if: always()
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID:-unused}.p8"

  android:
    name: Build and publish Google Play Internal Testing
    if: github.ref == 'refs/heads/main'
    needs: [quality, cinematic-media]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_CERTIFICATE_SHA1: '65:B5:34:95:6A:38:CF:CA:4D:8C:A2:1C:B0:E9:C6:7C:DA:A8:91:12'
    steps:
      - name: Check out the selected Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore the upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See docs/AUTOMATIC_MOBILE_BUILDS.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -J-Duser.language=en -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            > "$RUNNER_TEMP/android-upload-certificate.txt"
          node scripts/verify-android-upload-certificate.mjs "$RUNNER_TEMP/android-upload-certificate.txt"
          # Jobs are serialized; a fresh UTC timestamp also advances on a rerun.
          echo "ANDROID_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci

      - name: Configure production Android services
        env:
          ANDROID_ADMOB_MODE: 'off'
          ANDROID_ADMOB_APP_ID: ${{ vars.ANDROID_ADMOB_APP_ID }}
          ANDROID_ADMOB_INTERSTITIAL_ID: ${{ vars.ANDROID_ADMOB_INTERSTITIAL_ID }}
          ANDROID_ADMOB_REWARDED_ID: ${{ vars.ANDROID_ADMOB_REWARDED_ID }}
          ANDROID_ADMOB_CONTEXTUAL_INTERSTITIAL_ID: ${{ vars.ANDROID_ADMOB_CONTEXTUAL_INTERSTITIAL_ID }}
          VITE_SUPABASE_ENABLED: ${{ vars.VITE_SUPABASE_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_ACCOUNTS_ENABLED: ${{ vars.VITE_PLAYER_ACCOUNTS_ENABLED }}
          VITE_PLAYER_SIGN_IN_ENABLED: ${{ vars.VITE_PLAYER_SIGN_IN_ENABLED }}
        run: |
          cp .env.android.example .env.android
          cat >> .env.android <<EOF

          VITE_APP_ENVIRONMENT=qa
          VITE_BUILD_TARGET=release
          VITE_BUILD_ID=$GITHUB_SHA
          VITE_VIP_DEV_ENTITLEMENT=false
          VITE_ADMOB_MODE=$ANDROID_ADMOB_MODE
          VITE_ADMOB_APP_ID=$ANDROID_ADMOB_APP_ID
          VITE_ADMOB_INTERSTITIAL_ID=$ANDROID_ADMOB_INTERSTITIAL_ID
          VITE_ADMOB_REWARDED_ID=$ANDROID_ADMOB_REWARDED_ID
          VITE_ADMOB_CONTEXTUAL_INTERSTITIAL_ID=$ANDROID_ADMOB_CONTEXTUAL_INTERSTITIAL_ID
          VITE_SUPABASE_ENABLED=$VITE_SUPABASE_ENABLED
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_PLAYER_ACCOUNTS_ENABLED=$VITE_PLAYER_ACCOUNTS_ENABLED
          VITE_PLAYER_SIGN_IN_ENABLED=$VITE_PLAYER_SIGN_IN_ENABLED
          EOF
          npm run verify:store-env:android

      - name: Build and synchronize the Android internal testing bundle
        run: npm run sync:android

      - name: Sign the release bundle with the existing upload key
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify the signed bundle
        id: verify_bundle
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab \
            > "$RUNNER_TEMP/android-signature-verification.txt"
          cat "$RUNNER_TEMP/android-signature-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/android-signature-verification.txt"
          test -s android/app/build/outputs/mapping/release/mapping.txt
          unzip -Z1 android/app/build/outputs/bundle/release/app-release.aab \
            > "$RUNNER_TEMP/android-bundle-entries.txt"
          grep -qx 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' \
            "$RUNNER_TEMP/android-bundle-entries.txt"
          if grep -q '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/' \
            "$RUNNER_TEMP/android-bundle-entries.txt"; then
            echo "native_symbols_embedded=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_symbols_embedded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The AAB has no embedded native debug symbols. Check whether a prebuilt native library was already stripped before Gradle received it."
          fi

      - name: Save the Google Play bundle and diagnostics files
        id: android_bundle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 14

      - name: Check the Google Play connection
        id: play_connection
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publish-google-play-internal.mjs --check-connection

      - name: Authenticate for Google Play Internal Testing
        id: google_play_auth
        if: steps.play_connection.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          service_account: ${{ steps.play_connection.outputs.service_account }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Publish and verify the Google Play internal release
        id: play_upload
        if: steps.play_connection.outputs.configured == 'true'
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google_play_auth.outputs.access_token }}
        run: node scripts/publish-google-play-internal.mjs

      - name: Record signed Android build details
        if: always() && steps.android_bundle.outcome == 'success'
        run: |
          {
            echo "## Signed Google Play bundle"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Android version code: $ANDROID_VERSION_CODE"
            echo "- R8 mapping is embedded in the signed Android App Bundle."
            if [ "${{ steps.verify_bundle.outputs.native_symbols_embedded }}" = "true" ]; then
              echo "- Native debug symbols are embedded in the signed Android App Bundle."
            else
              echo "- Native debug symbols are not embedded; check the build warning for pre-stripped native libraries."
            fi
            if [ "${{ steps.play_upload.outcome }}" = "success" ]; then
              echo "- The exact version was verified on Google Play Internal Testing."
            elif [ "${{ steps.play_connection.outputs.configured }}" != "true" ]; then
              echo "- Built only, not uploaded: add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON once to enable automatic Internal Testing updates."
            else
              echo "- The signed AAB is available, but Google Play publishing failed. See the publishing step."
            fi
            echo "- The signed AAB remains available in this run's artifacts for manual recovery."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary upload signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-upload-key.jks"
