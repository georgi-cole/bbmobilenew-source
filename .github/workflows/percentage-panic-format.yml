name: Format Percentage Panic changes
on:
  push:
    branches:
      - feature/percentage-panic-global-quiz
    paths:
      - .github/workflows/percentage-panic-format.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/percentage-panic-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/percentage-panic-global-quiz
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format the changed Percentage Panic files
        run: |
          npx prettier --write             scripts/generate-percentage-panic-bank.mjs             src/components/PercentagePanic/PercentagePanic.css             src/components/PercentagePanic/PercentagePanic.tsx             src/features/percentagePanic/logic.ts             src/minigames/registryBase.ts             tests/minigames.percentagePanic.rules.test.ts
      - name: Commit formatting to existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-percentage-panic-bank.mjs src/components/PercentagePanic/PercentagePanic.css src/components/PercentagePanic/PercentagePanic.tsx src/features/percentagePanic/logic.ts src/minigames/registryBase.ts tests/minigames.percentagePanic.rules.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: apply repository Prettier formatting to Percentage Panic"
            git push origin HEAD:feature/percentage-panic-global-quiz
          fi
