name: PR1556 Targeted QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run issue 1-11 regression pack
        shell: bash
        run: |
          set -euo pipefail

          npx vitest run tests/integration/ceremony.fixes.test.tsx -t "Ceremony follow-up: eviction vote breakdown reward prompt"
          npx vitest run tests/unit/majorityRules/majorityRules.component.test.tsx -t "starts a revote without reopening stale LIVE INTEL"
          npx vitest run src/store/__tests__/lohNominationPlanning.ambushCriteria.test.ts
          npx vitest run src/social/__tests__/incomingInteractionAutonomy.test.ts -t "routes allied co-nominees to a check-in"
          npx vitest run src/social/__tests__/incomingInteractionResolution.test.ts -t "gives co-nominees choices"
          npx vitest run src/social/__tests__/weekendSocialIncoming.test.ts -t "dedupes routine weekend replies"
          npx vitest run tests/qa.pr1556.layout.test.ts
          npx vitest run tests/minigames.findYourTwin2.mobileShell.test.ts
          npx vitest run tests/broadcastManager.reducer.test.ts -t "cannot re-promote Democracia ballot receipts"
          npx vitest run tests/broadcastTemplateCatalog.test.ts -t "does not let bundled live config promote the Democracia ballot"
          npx vitest run tests/democracia.flow.test.ts -t "uses Hub terminology throughout the Democracia ballotage result"
          npx vitest run src/components/ui/__tests__/TvZone.announcement.test.tsx -t "replaces the LOH announcement with the Democracia shock before voting begins"
          npx vitest run tests/unit/ui/TvZone.twist.test.tsx -t "does not render the SHOCK badge while a weekend interlude is active"
