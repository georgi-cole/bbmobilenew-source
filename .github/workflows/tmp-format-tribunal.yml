name: Temporary Tribunal Formatter

on:
  push:
    branches:
      - feat/tribunal-rules-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tribunal-rules-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Tribunal changes
        run: >-
          npx prettier --write
          src/components/FinalFaceoff/FinalFaceoff.tsx
          src/components/FinalFaceoff/JurorBubble.tsx
          src/rules/tribunalPolicy.ts
          src/store/__tests__/finaleSlice.test.ts
          src/store/finaleSlice.ts
          src/minigames/legacy/trivia-pulse.js
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-format-tribunal.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Tribunal rules cleanup"
          git push origin HEAD:feat/tribunal-rules-cleanup
