name: Submit verified The Big Eye build for App Review
on:
  push:
    branches: [release/app-review-46029489053]
    paths: ['.github/workflows/check-app-store-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the verified iPhone-only signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repository = 'georgi-cole/bbmobilenew-source'
          const runId = '46029489053'
          const source = 'a6dc8a945874b4c99fe1ae6e2d75c6da537ea99b'
          const endpoint = `https://api.github.com/repos/${repository}/actions/runs/${runId}`
          const get = async (suffix = '') => {
            const response = await fetch(endpoint + suffix, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            })
            if (!response.ok) throw new Error(`Unable to verify the iPhone build, GitHub HTTP ${response.status}.`)
            return response.json()
          }
          const run = await get()
          if (run.head_sha !== source || run.run_attempt !== 1 || run.head_branch !== 'main' ||
              run.name !== 'Build TestFlight and Google Play test apps') {
            throw new Error('The selected iPhone build does not match the approved source and attempt.')
          }
          const deadline = Date.now() + 48 * 60 * 1000
          while (Date.now() < deadline) {
            const { jobs } = await get('/attempts/1/jobs?per_page=30')
            const ios = jobs.find(({ name }) => name === 'Build, sign, and upload iOS app')
            if (ios?.status === 'completed') {
              const verifiedSteps = [
                'Verify the signed IPA targets iPhone only',
                'Upload the build to App Store Connect',
                'Complete compliance and verify internal TestFlight availability',
              ]
              if (ios.conclusion !== 'success' || ios.head_sha !== source ||
                  !verifiedSteps.every((name) => ios.steps.some((step) => step.name === name && step.conclusion === 'success'))) {
                throw new Error('The signed iPhone build failed its upload or device-family verification.')
              }
              console.log('Verified the iPhone-only IPA and the exact TestFlight upload.')
              process.exit(0)
            }
            await new Promise((resolve) => setTimeout(resolve, 35000))
          }
          throw new Error('The verified iPhone build timed out before App Store submission.')
          NODE

      - name: Verify and submit build 46029489053.1
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { createAppleClient } from './scripts/lib/testflight-readiness.mjs'

          const appId = '6828006735'
          const buildNumber = '46029489053.1'
          const read = createAppleClient({
            issuerId: process.env.ASC_API_ISSUER_ID,
            keyId: process.env.ASC_API_KEY_ID,
            privateKeyBase64: process.env.ASC_API_KEY_P8_BASE64,
            fetchImpl: async (url, options) => {
              const response = await fetch(url, options)
              if (!response.ok && options.method !== 'GET') {
                const payload = await response.clone().json().catch(() => ({}))
                const sanitize = (value) => String(value ?? '')
                  .replace(/https?:\/\/[^\s]+/g, '<url>')
                  .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig, '<email>')
                  .replace(/(?<![\w.-])\+?[0-9][() 0-9.-]{8,}[0-9](?![\w.-])/g, '<number>')
                  .replace(/[\r\n\x00-\x1f\x7f]+/g, ' ')
                  .slice(0, 500)
                const describe = ({ code, source, title, detail }) => ({
                  code: sanitize(code),
                  field: sanitize(source?.pointer ?? source?.parameter),
                  title: sanitize(title),
                  detail: sanitize(detail),
                })
                console.log('APP_REVIEW_VALIDATION ' + JSON.stringify((payload.errors ?? []).map((error) => ({
                  ...describe(error),
                  related: Object.entries(error.meta?.associatedErrors ?? {}).flatMap(([path, entries]) =>
                    Array.isArray(entries) ? entries.map((entry) => ({ resource: sanitize(path), ...describe(entry) })) : [],
                  ),
                }))))
              }
              return response
            },
          })

          const filter = new URLSearchParams({
            'filter[app]': appId,
            'filter[version]': buildNumber,
            'filter[preReleaseVersion.platform]': 'IOS',
            include: 'app,preReleaseVersion',
            limit: '2',
          })
          const [app, builds, versions, submissions] = await Promise.all([
            read('GET', `/v1/apps/${appId}?fields[apps]=name,bundleId,primaryLocale`),
            read('GET', `/v1/builds?${filter}`),
            read('GET', `/v1/apps/${appId}/appStoreVersions?filter[platform]=IOS&include=build&limit=20`),
            read('GET', `/v1/apps/${appId}/reviewSubmissions?filter[platform]=IOS&include=appStoreVersionForReview&limit=20`),
          ])
          if (app.data.id !== appId || app.data.attributes.bundleId !== 'com.georgicole.thebigeye') {
            throw new Error('App Store Connect returned the wrong app.')
          }
          if (builds.data.length !== 1) throw new Error('The requested build did not resolve uniquely.')
          const [build] = builds.data
          if (build.relationships.app.data.id !== appId || build.attributes.version !== buildNumber) {
            throw new Error('App Store Connect returned a different build.')
          }
          const train = builds.included.find(({ id }) => id === build.relationships.preReleaseVersion.data.id)
          const matchingVersions = versions.data.filter(
            ({ attributes }) => attributes.versionString === train.attributes.version
          )
          const localizationSummaries = await Promise.all(matchingVersions.map(async ({ id }) => {
            const { data } = await read('GET', `/v1/appStoreVersions/${id}/appStoreVersionLocalizations?limit=50`)
            return [id, data.map(({ attributes }) => ({
              locale: attributes.locale,
              hasWhatsNew: Boolean(attributes.whatsNew?.trim()),
              hasDescription: Boolean(attributes.description?.trim()),
            }))]
          }))
          const buildNumbers = new Map((versions.included ?? []).filter(({ type }) => type === 'builds')
            .map(({ id, attributes }) => [id, attributes.version]))
          console.log('APP_REVIEW_SNAPSHOT ' + JSON.stringify({
            app: { id: appId, ...app.data.attributes },
            requestedBuild: {
              id: build.id,
              number: buildNumber,
              marketingVersion: train.attributes.version,
              platform: train.attributes.platform,
              processingState: build.attributes.processingState,
              usesNonExemptEncryption: build.attributes.usesNonExemptEncryption,
              expired: build.attributes.expired,
              buildAudienceType: build.attributes.buildAudienceType,
            },
            storeVersions: versions.data.map(({ id, attributes, relationships }) => ({
              id,
              version: attributes.versionString,
              appVersionState: attributes.appVersionState,
              appStoreState: attributes.appStoreState,
              releaseType: attributes.releaseType,
              phasedRelease: relationships?.appStoreVersionPhasedRelease?.data?.id,
              selectedBuild: buildNumbers.get(relationships?.build?.data?.id),
            })),
            reviewSubmissions: submissions.data.map(({ id, attributes, relationships }) => ({
              id,
              state: attributes.state,
              versionId: relationships?.appStoreVersionForReview?.data?.id,
            })),
            localizations: Object.fromEntries(localizationSummaries),
          }))

                    const allowedStates = new Set(['WAITING_FOR_REVIEW', 'IN_REVIEW', 'COMPLETING'])
                    if (train.attributes.platform !== 'IOS' || build.attributes.processingState !== 'VALID' ||
                        build.attributes.expired || build.attributes.buildAudienceType === 'INTERNAL_ONLY') {
                      throw new Error('This iOS build is not eligible for App Store submission.')
                    }
                    if (matchingVersions.length !== 1) throw new Error('There is no unique matching App Store version.')
                    const [version] = matchingVersions
                    const versionState = version.attributes.appVersionState ?? version.attributes.appStoreState
                    const path = `/v1/appStoreVersions/${version.id}/relationships/build`
                    const currentBuild = async () => (await read('GET', path)).data?.id
                    if (allowedStates.has(versionState) && await currentBuild() === build.id) {
                      console.log(`APP_REVIEW_VERIFIED ${JSON.stringify({ build: buildNumber, version: train.attributes.version, status: versionState, releaseType: version.attributes.releaseType })}`)
                      process.exit(0)
                    }
                    if (version.id !== '667c734a-39a8-4ddd-839f-eb28f45fe10d' || train.attributes.version !== '1.0.2') {
                      throw new Error('Apple returned a different App Store version from the one approved for submission.')
                    }
                    if (!['PREPARE_FOR_SUBMISSION', 'READY_FOR_REVIEW', 'DEVELOPER_REJECTED'].includes(versionState)) {
                      throw new Error(`The existing App Store version is ${versionState} and cannot be edited for this submission.`)
                    }

                    const refreshed = await read('GET', `/v1/apps/${appId}/reviewSubmissions?filter[platform]=IOS&include=appStoreVersionForReview&limit=20`)
                    const active = refreshed.data.filter(({ attributes }) => attributes.state !== 'COMPLETE')
                    let draft
                    let emptyDraft
                    for (const submission of active) {
                      if (submission.attributes.state !== 'READY_FOR_REVIEW') {
                        throw new Error(`An App Review submission is already ${submission.attributes.state}.`)
                      }
                      const { data: items, links } = await read('GET', `/v1/reviewSubmissions/${submission.id}/items?include=appStoreVersion&limit=50`)
                      if (items.length === 0) {
                        emptyDraft ??= submission
                        continue
                      }
                      if (draft || links?.next || items.length !== 1 ||
                          items[0].relationships?.appStoreVersion?.data?.id !== version.id) {
                        throw new Error('Another item is present in an existing draft review submission.')
                      }
                      draft = submission
                    }

                    if (await currentBuild() !== build.id) {
                      await read('PATCH', path, { data: { type: 'builds', id: build.id } })
                    }
                    if (await currentBuild() !== build.id) throw new Error('Apple did not select the exact build.')
                    if (!draft) {
                      draft = emptyDraft ?? (await read('POST', '/v1/reviewSubmissions', {
                        data: {
                          type: 'reviewSubmissions',
                          attributes: { platform: 'IOS' },
                          relationships: { app: { data: { type: 'apps', id: appId } } },
                        },
                      })).data
                      await read('POST', '/v1/reviewSubmissionItems', {
                        data: {
                          type: 'reviewSubmissionItems',
                          relationships: {
                            reviewSubmission: { data: { type: 'reviewSubmissions', id: draft.id } },
                            appStoreVersion: { data: { type: 'appStoreVersions', id: version.id } },
                          },
                        },
                      })
                    }
                    const endpoint = `/v1/reviewSubmissions/${draft.id}`
                    const { data: items, links } = await read('GET', `${endpoint}/items?include=appStoreVersion&limit=50`)
                    if (links?.next || items.length !== 1 || items[0].relationships?.appStoreVersion?.data?.id !== version.id) {
                      throw new Error('The draft review contains an unexpected item.')
                    }
                    await read('PATCH', endpoint, {
                      data: { type: 'reviewSubmissions', id: draft.id, attributes: { submitted: true } },
                    })
                    for (let attempt = 0; attempt < 10; attempt++) {
                      const { data: review } = await read('GET', endpoint)
                      if (allowedStates.has(review.attributes.state) && await currentBuild() === build.id) {
                        console.log(`APP_REVIEW_VERIFIED ${JSON.stringify({ build: buildNumber, version: train.attributes.version, status: review.attributes.state, releaseType: version.attributes.releaseType, submissionId: draft.id })}`)
                        process.exit(0)
                      }
                      await new Promise((resolve) => setTimeout(resolve, 4000))
                    }
                    throw new Error('Apple did not confirm the review state and attached build within the verification window.')
          NODE
