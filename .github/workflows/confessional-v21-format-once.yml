name: Confessional V21 Format Once

on:
  push:
    branches:
      - feature/confessional-v21-grounded-dialogue

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/confessional-v21-grounded-dialogue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed V2.1 files
        run: |
          npx prettier --write \
            public/config/live-config.json \
            server/live-config.example.json \
            src/bb/__tests__/confessionalBigEye.test.ts \
            src/bb/__tests__/confessionalComprehension.test.ts \
            src/bb/__tests__/localBigEyeDirector.test.ts \
            src/bb/confessionalCalibration.ts \
            src/bb/confessionalComprehension.ts \
            src/screens/ConfessionalLab/ConfessionalLab.tsx \
            src/screens/DiaryRoom/DiaryRoom.tsx
      - name: Commit formatter result
        run: |
          rm .github/workflows/confessional-v21-format-once.yml
          printf 'remove me after formatter commit\n' > .confessional-v21-format-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Confessional V2.1 changes"
          git push origin HEAD:feature/confessional-v21-grounded-dialogue
