name: Enable uploaded TestFlight candidate

on:
  push:
    branches:
      - release/testflight-status-2026-11-14
    paths:
      - .github/workflows/testflight-availability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/release/testflight-status-2026-11-14'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify processing and enable existing tester groups
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { sign } from 'node:crypto';
          const appId = '6828006735';
          const targetVersion = '43517194416';
          for (const key of ['ASC_API_ISSUER_ID', 'ASC_API_KEY_ID', 'ASC_API_KEY_P8_BASE64']) {
            if (!process.env[key]) throw new Error('Missing App Store Connect credential: ' + key);
          }
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = encode({ alg: 'ES256', kid: process.env.ASC_API_KEY_ID, typ: 'JWT' });
          const payload = encode({ iss: process.env.ASC_API_ISSUER_ID, iat: now, exp: now + 180, aud: 'appstoreconnect-v1' });
          const input = header + '.' + payload;
          const signature = sign('sha256', Buffer.from(input), {
            key: Buffer.from(process.env.ASC_API_KEY_P8_BASE64, 'base64'),
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          const token = input + '.' + signature;
          console.log('::add-mask::' + token);
          async function get(path) {
            const response = await fetch('https://api.appstoreconnect.apple.com' + path, {
              headers: { Authorization: 'Bearer ' + token },
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(JSON.stringify({ status: response.status, errors: body.errors }));
            return body;
          }
          const builds = await get('/v1/builds?filter[app]=' + appId + '&limit=20&sort=-uploadedDate');
          console.log('Recent builds:', JSON.stringify(builds.data.map(({ id, attributes }) => ({ id, ...attributes }))));
          const target = builds.data.find(({ attributes }) => attributes.version === targetVersion);
          if (!target) throw new Error('Uploaded build not present in the latest 20 builds');
          const groups = await get('/v1/apps/' + appId + '/betaGroups?limit=200');
          console.log('Existing groups:', JSON.stringify(groups.data.map(({ id, attributes }) => ({ id, name: attributes.name, isInternalGroup: attributes.isInternalGroup, hasAccessToAllBuilds: attributes.hasAccessToAllBuilds }))));
          if (target.attributes.processingState !== 'VALID' || target.attributes.expired) {
            throw new Error('The uploaded candidate is not a valid, unexpired build');
          }
          const details = await get('/v1/builds/' + target.id + '/buildBetaDetail');
          console.log('Target build beta state before:', JSON.stringify(details.data.attributes));
          const allowedGroupIds = new Set([
            '0e2847bd-e49a-4316-91f4-e337dd11d188',
            '6c30e120-0770-462c-b97b-b87f3da16e18',
          ]);
          const existingGroups = [];
          for (const group of groups.data.filter(({ id }) => allowedGroupIds.has(id))) {
            const groupBuilds = await get('/v1/betaGroups/' + group.id + '/builds?limit=200');
            console.log('Group build access before:', JSON.stringify({ id: group.id, name: group.attributes.name, builds: groupBuilds.data.map(({ id, attributes }) => ({ id, version: attributes.version, processingState: attributes.processingState })) }));
            existingGroups.push({ group, builds: groupBuilds.data });
          }
          async function post(path, body) {
            const response = await fetch('https://api.appstoreconnect.apple.com' + path, {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            const result = response.status === 204 ? null : await response.json();
            if (!response.ok) throw new Error(JSON.stringify({ status: response.status, errors: result?.errors }));
            return result;
          }
          try {
          if (existingGroups.some(({ group }) => !group.attributes.isInternalGroup)) {
            const localizations = await get('/v1/builds/' + target.id + '/betaBuildLocalizations?limit=200');
            if (!localizations.data.some(({ attributes }) => attributes.locale === 'en-US')) {
              await post('/v1/betaBuildLocalizations', { data: {
                type: 'betaBuildLocalizations',
                attributes: { locale: 'en-US', whatsNew: 'Test the streamlined account sign-in and play-without-signing-in flow, profile creation in the Changing Room, consistent three-profile limits, and stable profile sync. This candidate also includes the cumulative gameplay and presentation fixes.' },
                relationships: { build: { data: { type: 'builds', id: target.id } } },
              } });
              console.log('Added English testing notes to this candidate');
            }
            if (['READY_FOR_BETA_SUBMISSION', 'READY_FOR_REVIEW'].includes(details.data.attributes.externalBuildState)) {
              const submission = await post('/v1/betaAppReviewSubmissions', { data: {
                type: 'betaAppReviewSubmissions',
                relationships: { build: { data: { type: 'builds', id: target.id } } },
              } });
              console.log('Beta review submission:', JSON.stringify({ id: submission.data.id, ...submission.data.attributes }));
            }
          }
          } catch (error) {
            console.log('External beta preparation pending:', error.message);
          }
          for (const { group, builds: accessibleBuilds } of existingGroups) {
            if (!accessibleBuilds.some(({ id }) => id === target.id)) {
              try {
                await post('/v1/builds/' + target.id + '/relationships/betaGroups', { data: [{ type: 'betaGroups', id: group.id }] });
                console.log('Enabled candidate for existing group:', group.attributes.name);
              } catch (error) {
                console.log('Group assignment pending:', group.attributes.name, error.message);
              }
            }
            const verified = await get('/v1/betaGroups/' + group.id + '/builds?limit=200');
            console.log('Verified target access:', JSON.stringify({ name: group.attributes.name, isInternalGroup: group.attributes.isInternalGroup, targetIncluded: verified.data.some(({ id }) => id === target.id) }));
          }
          const finalDetails = await get('/v1/builds/' + target.id + '/buildBetaDetail');
          console.log('Target build beta state after:', JSON.stringify(finalDetails.data.attributes));
          NODE
