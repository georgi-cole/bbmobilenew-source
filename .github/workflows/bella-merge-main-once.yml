name: Merge Main Into Bella Once

on:
  push:
    branches:
      - agent/bellas-will

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bellas-will
          fetch-depth: 0

      - name: Merge main and resolve Bella conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/store/gameSlice.ts')
          text = path.read_text()

          def resolve_conflicts(source: str) -> str:
              out = []
              cursor = 0
              while True:
                  start = source.find('<<<<<<< HEAD\n', cursor)
                  if start == -1:
                      out.append(source[cursor:])
                      break
                  out.append(source[cursor:start])
                  mid = source.find('=======\n', start)
                  end = source.find('>>>>>>> origin/main\n', mid)
                  if mid == -1 or end == -1:
                      raise SystemExit('Unexpected conflict marker shape')
                  ours = source[start + len('<<<<<<< HEAD\n'):mid]
                  theirs = source[mid + len('=======\n'):end]

                  if 'debugForceBellaIntoCast' in ours and 'refreshSeasonDirectorPlan' in theirs:
                      resolved = ours.rstrip() + '\n' + theirs.lstrip()
                  elif (
                      "const jurors = game.players.filter((p) => p.status === 'jury' && p.id !== BELLA_ID)"
                      in ours
                      and 'const plan = game.seasonDirectorPlan' in theirs
                  ):
                      resolved = theirs
                      resolved = resolved.replace(
                          "const jurors = game.players.filter((player) => player.status === 'jury')",
                          "const jurors = game.players.filter(\n"
                          "        (player) => player.status === 'jury' && player.id !== BELLA_ID\n"
                          "      )",
                      )
                      resolved = resolved.replace(
                          "const jurors = game.players.filter((p) => p.status === 'jury')",
                          "const jurors = game.players.filter(\n"
                          "      (p) => p.status === 'jury' && p.id !== BELLA_ID\n"
                          "    )",
                      )
                  else:
                      raise SystemExit('Unrecognized gameSlice conflict block')

                  out.append(resolved)
                  cursor = end + len('>>>>>>> origin/main\n')
              merged = ''.join(out)
              if '<<<<<<<' in merged or '=======' in merged or '>>>>>>>' in merged:
                  raise SystemExit('Conflict markers remain')
              return merged

          path.write_text(resolve_conflicts(text))
          PY

          git add src/store/gameSlice.ts src/store/store.ts src/types/index.ts
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Remove one-shot workflows and commit merge
        run: |
          rm -f .github/workflows/bella-merge-conflict-diagnostic.yml
          rm -f .github/workflows/bella-merge-main-once.yml
          git add -A
          git commit -m "Merge main into Bella wildcard PR"
          git push origin HEAD:agent/bellas-will
