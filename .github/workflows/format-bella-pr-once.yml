name: Format Bella PR Once

on:
  push:
    branches:
      - agent/bellas-will

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Bella branch
        uses: actions/checkout@v4
        with:
          ref: agent/bellas-will
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Bella changes
        run: |
          npx prettier --write \
            src/components/DebugPanel/DebugPanel.tsx \
            src/features/twists/__tests__/bellasWill.test.ts \
            src/features/twists/bellaProgressMiddleware.ts \
            src/features/twists/bellasWill.ts \
            src/store/eliminatedSeasonResolutionMiddleware.ts \
            src/store/gameSlice.ts \
            tests/unit/bellasWill.voteEffects.test.ts

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-bella-pr-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Bella PR changes"
          git push origin HEAD:agent/bellas-will
