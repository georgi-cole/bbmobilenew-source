name: BOXED OUT temporary formatter
on:
  push:
    branches:
      - feat/boxed-out-three-lives
permissions:
  contents: write
jobs:
  format-once:
    if: "!contains(github.event.head_commit.message, 'chore(boxed-out): apply prettier')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boxed-out-three-lives
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/boxedOut/rules.ts src/components/BoxedOut/BoxedOut.tsx src/components/BoxedOut/BoxedOut.css tests/minigames.boxedOut.rules.test.ts
      - name: Commit formatting to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/boxedOut/rules.ts src/components/BoxedOut/BoxedOut.tsx src/components/BoxedOut/BoxedOut.css tests/minigames.boxedOut.rules.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(boxed-out): apply prettier"
            git push origin HEAD:feat/boxed-out-three-lives
          fi
