name: Pull Request Mobile Browser Quality

on:
  pull_request:

concurrency:
  group: pr-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the existing required check name so branch protection remains intact.
  # Run the deployment smoke matrix here so browser regressions fail before merge.
  core-journeys:
    name: Core journeys (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install smoke browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run deployment smoke journeys before merge
        run: >-
          npx playwright test --grep @smoke --grep-invert @minigame
          --project=mobile-chromium --project=mobile-webkit
          --project=compact-mobile-chromium --workers=1 --retries=0
      - name: Run finale progression and recovery journey
        run: >-
          npx playwright test e2e/playwright/finale.spec.ts
          --project=${{ matrix.project }} --workers=1 --retries=0
      - name: Upload blocking smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  # Every other core journey still runs on every PR, but it is advisory until
  # its first-run reliability is high enough to earn blocking status.
  extended-core-journeys:
    name: Extended core journeys (mobile-chromium, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture Capitalization visual evidence
        run: >-
          npx playwright test e2e/playwright/capitalization.visual.spec.ts
          --project=mobile-chromium --workers=1 --retries=0
      - name: Upload Capitalization visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitalization-visual-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Run non-blocking extended core journeys
        run: >-
          npx playwright test --grep @core-journey
          --grep-invert "fresh player creates a profile and launches a usable campaign|saved progress survives a browser reload and resumes at the exact phase|completes a valid finale, reward, recap, and archive exactly once"
          --project=mobile-chromium --workers=1 --retries=0
      - name: Upload advisory browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-extended-mobile-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
