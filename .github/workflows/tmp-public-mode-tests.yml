name: Temporary Public Mode Focused Tests

on:
  push:
    branches:
      - feature/public-mode-audience-simulation

permissions:
  contents: read

jobs:
  public-mode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused Public Mode tests
        run: npx vitest run tests/unit/publicOpinion src/publicOpinion/__tests__ --reporter=dot
