name: Temporary Eyeolean Formatter

on:
  push:
    branches:
      - feature/eyeolean-economy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyeolean-economy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Eyeolean changes
        run: >-
          npx prettier --write
          docs/EYEOLEAN_ECONOMY.md
          src/components/PublicFavoriteOverlay/PublicFavoriteOverlay.tsx
          src/store/profilesSlice.ts
          tests/unit/publicFavoriteOverlay.test.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EYEOLEAN_ECONOMY.md
          git add src/components/PublicFavoriteOverlay/PublicFavoriteOverlay.tsx
          git add src/store/profilesSlice.ts
          git add tests/unit/publicFavoriteOverlay.test.tsx
          git commit -m "Format Eyeolean implementation"
          git push origin HEAD:feature/eyeolean-economy
