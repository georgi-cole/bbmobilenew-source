name: Confessional Lab Format Once

on:
  push:
    branches:
      - feature/confessional-calibration-lab

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/confessional-calibration-lab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Confessional Lab files
        run: |
          npx prettier --write \
            docs/BIG_EYE_CONFESSIONAL.md \
            src/bb/__tests__/confessionalCalibration.test.ts \
            src/bb/confessionalCalibration.ts \
            src/components/DebugPanel/DebugPanel.tsx \
            src/routes.tsx \
            src/screens/ConfessionalLab/ConfessionalLab.css \
            src/screens/ConfessionalLab/ConfessionalLab.tsx \
            src/services/bigBrother.ts
      - name: Commit formatter result
        run: |
          rm .github/workflows/confessional-lab-format-once.yml
          printf 'remove me after formatter commit\n' > .confessional-lab-format-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Confessional calibration lab"
          git push origin HEAD:feature/confessional-calibration-lab
