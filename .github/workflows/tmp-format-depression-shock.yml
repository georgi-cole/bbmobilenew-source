name: Temporary Depression Shock Formatter

on:
  push:
    branches:
      - fix/mobile-viewport-blackjack-social-risk-wheel

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-viewport-blackjack-social-risk-wheel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR 1556 changes
        run: >-
          npx prettier --write
          public/minigames/twin-remastered/part2/index.html
          src/components/BlackjackTournamentComp/BlackjackTournamentComp.css
          src/components/RiskWheelComp/RiskWheelComp.css
          src/components/SocialPanelV2/SocialPanelV2.css
          src/components/ui/TvZone.tsx
          src/social/__tests__/weekendSocialIncoming.test.ts
          src/social/socialMiddleware.ts
          src/store/__tests__/lohNominationPlanning.ambushCriteria.test.ts
          src/store/lohNominationPlanning.ts
          tests/broadcastTemplateCatalog.test.ts
          tests/minigames.findYourTwin2.mobileShell.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/minigames/twin-remastered/part2/index.html
          git add src/components/BlackjackTournamentComp/BlackjackTournamentComp.css
          git add src/components/RiskWheelComp/RiskWheelComp.css
          git add src/components/SocialPanelV2/SocialPanelV2.css
          git add src/components/ui/TvZone.tsx
          git add src/social/__tests__/weekendSocialIncoming.test.ts
          git add src/social/socialMiddleware.ts
          git add src/store/__tests__/lohNominationPlanning.ambushCriteria.test.ts
          git add src/store/lohNominationPlanning.ts
          git add tests/broadcastTemplateCatalog.test.ts
          git add tests/minigames.findYourTwin2.mobileShell.test.ts
          git commit -m "Format PR 1556 implementation"
          git push origin HEAD:fix/mobile-viewport-blackjack-social-risk-wheel
