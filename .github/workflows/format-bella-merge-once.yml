name: Format Bella Merge Once

on:
  push:
    branches:
      - agent/bellas-will

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bellas-will
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format merged game slice
        run: npx prettier --write src/store/gameSlice.ts
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-bella-merge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format merged Bella game slice"
          git push origin HEAD:agent/bellas-will
