name: Temp Eyeolean Store Verify

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: >
          npx prettier --check
          src/economy/storeCatalog.ts
          src/store/profilesSlice.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/screens/Store/Store.tsx
          src/screens/Store/Store.css
      - name: Typecheck
        run: npm run typecheck
      - name: Eyeolean wallet tests
        run: npx vitest run src/store/profilesSlice.eyeoleans.test.ts
