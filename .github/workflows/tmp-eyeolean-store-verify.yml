name: Temp Eyeolean Store Verify

on:
  push:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyeolean-economy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed Store files
        run: >
          npx prettier --write
          src/economy/storeCatalog.ts
          src/store/profilesSlice.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/screens/Store/Store.tsx
          src/screens/Store/Store.css
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/economy/storeCatalog.ts src/store/profilesSlice.ts src/store/profilesSlice.eyeoleans.test.ts src/screens/Store/Store.tsx src/screens/Store/Store.css
          git commit -m "Format Eyeolean store files"
          git push origin HEAD:feature/eyeolean-economy
      - name: Formatting
        run: >
          npx prettier --check
          src/economy/storeCatalog.ts
          src/store/profilesSlice.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/screens/Store/Store.tsx
          src/screens/Store/Store.css
      - name: Typecheck
        run: npm run typecheck
      - name: Eyeolean wallet tests
        run: npx vitest run src/store/profilesSlice.eyeoleans.test.ts
