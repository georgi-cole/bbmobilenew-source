name: Scheduled Product Quality

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

concurrency:
  group: scheduled-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-regression:
    name: Full unit, integration, and coverage regression
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:guard
      - name: Run the complete product suite once while producing coverage
        run: npm run test:coverage
      - run: npm run coverage:check

  deterministic-stress:
    name: Fifty-seed minigame matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MINIGAME_SEED_COUNT: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:guard
      - run: npx vitest run tests/minigames.seedStress.test.tsx --maxWorkers=2 --reporter=verbose

  browser-matrix:
    name: Browser matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run representative scheduled browser coverage
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
