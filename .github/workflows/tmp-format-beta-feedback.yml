name: Temporary PR formatting

on:
  push:
    branches:
      - fix/beta-bug-report-flow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            js/ui/introHub.js \
            public/bbmobilenew/js/ui/introHub.js \
            public/js/ui/introHub.js \
            src/components/FloatingActionBar/FloatingActionBar.tsx \
            src/components/GameControlDock/GameControlDock.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui/introHub.js public/bbmobilenew/js/ui/introHub.js public/js/ui/introHub.js src/components/FloatingActionBar/FloatingActionBar.tsx src/components/GameControlDock/GameControlDock.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format beta feedback flow"
            git push
          fi
