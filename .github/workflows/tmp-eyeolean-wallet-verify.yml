name: Temp Eyeolean Wallet Verify

on:
  push:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyeolean-wallet-powers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed Wallet files
        run: >
          npx prettier --write
          src/economy/eyeoleanPowerRules.ts
          src/economy/eyeoleanPowerLifecycle.ts
          src/store/eyeoleanPowerMiddleware.ts
          src/store/profilesSlice.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/store/gameSlice.ts
          src/store/store.ts
          src/store/criticalGameRules.ts
          src/store/__tests__/criticalShockRuleMatrix.test.ts
          src/store/eyeoleanPowerFlow.test.ts
          src/types/index.ts
          src/screens/DiaryRoom/ConfessionalWallet.tsx
          src/screens/DiaryRoom/DiaryRoom.tsx
          src/screens/DiaryRoom/DiaryRoom.css
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/economy/eyeoleanPowerRules.ts src/economy/eyeoleanPowerLifecycle.ts src/store/eyeoleanPowerMiddleware.ts src/store/profilesSlice.ts src/store/profilesSlice.eyeoleans.test.ts src/store/gameSlice.ts src/store/store.ts src/store/criticalGameRules.ts src/store/__tests__/criticalShockRuleMatrix.test.ts src/store/eyeoleanPowerFlow.test.ts src/types/index.ts src/screens/DiaryRoom/ConfessionalWallet.tsx src/screens/DiaryRoom/DiaryRoom.tsx src/screens/DiaryRoom/DiaryRoom.css
          git commit -m "Format Eyeolean Wallet power files"
          git push --no-verify origin HEAD:feature/eyeolean-wallet-powers
      - name: Formatting
        run: >
          npx prettier --check
          src/economy/eyeoleanPowerRules.ts
          src/economy/eyeoleanPowerLifecycle.ts
          src/store/eyeoleanPowerMiddleware.ts
          src/store/profilesSlice.ts
          src/store/profilesSlice.eyeoleans.test.ts
          src/store/gameSlice.ts
          src/store/store.ts
          src/store/criticalGameRules.ts
          src/store/__tests__/criticalShockRuleMatrix.test.ts
          src/store/eyeoleanPowerFlow.test.ts
          src/types/index.ts
          src/screens/DiaryRoom/ConfessionalWallet.tsx
          src/screens/DiaryRoom/DiaryRoom.tsx
          src/screens/DiaryRoom/DiaryRoom.css
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted tests
        run: >
          npx vitest run
          src/store/profilesSlice.eyeoleans.test.ts
          src/store/eyeoleanPowerFlow.test.ts
          src/store/__tests__/criticalShockRuleMatrix.test.ts
          tests/unit/bellasWill.voteEffects.test.ts
          tests/unit/secretMission/secretMission.activation.test.ts
